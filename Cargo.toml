[package]
name = "code_genie"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
hashbrown = "0.14"
rustc-hash = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
smallvec = "1"
toml = "0.8"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Profiling 专用：继承 release 的优化，但保留调试符号以便火焰图/采样器解析函数名。
# panic = "unwind" 让部分采样器（dtrace/Instruments）回溯更稳。仅用于性能分析，不影响 release。
[profile.profiling]
inherits = "release"
debug = true
panic = "unwind"

[[bin]]
name = "code_genie"
path = "src/main.rs"
